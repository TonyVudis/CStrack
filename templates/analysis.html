
<!DOCTYPE html>
<html>
<head>
    <title>Player Analysis</title>
    <style>

        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap');

        .black-ops-one-regular {
        font-family: "Black Ops One", system-ui;
        font-weight: 400;
        font-style: normal;
        }

        body {
            font-family: "Black Ops One";
            margin: 0;
            background-color: #BDB7AB;
            color: #2b0505;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 3rem;
            background-color: #877F7D;
            border-bottom: 0.5px solid #6b1a1a;
        }

        header nav a {
            margin-left: 1.5rem;
            font-size: 1.5rem;
            text-decoration: none;
            color: #2b0505;
        }

        .leetify-credit {
            bottom: 1.5rem;
            left: 1.5rem;
            text-align: center;
            font-size: 1.5rem;
        }

        .leetify-credit p {
            margin: 0 0 0.4rem 0;
        }

        .layout {
            display: flex;
            padding: 2rem;
            gap: 2rem;
        }

        .player-name {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 2.5rem;
        }

        .stats {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-row {
            width: 75%;
            background-color: #877F7D;
            border: none;
            border-radius: 16px;
            margin-bottom: 1.25rem;
            overflow: hidden;
        }

        .stat-row summary {
            padding: 1.5rem 1.75rem;
            font-size: 1.15rem;
            cursor: pointer;
            font-weight: 600;
            list-style: none;
        }

        .stat-row .stat-detail {
            padding: 0.75rem 1.25rem 1.25rem;
            background-color: #a79e9e;
            color: #2b0505;
        }

        .stat-row.green summary {
            border-left: 20px solid #2e7d32;
        }

        .stat-row.yellow summary {
            border-left: 20px solid #d4a017;
        }

        .stat-row.red summary {
            border-left: 20px solid #c62828;
        }
    </style>
</head>
<body>

    <header>
        <a href="{{ url_for('home') }}">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" height="160">
        </a>
        <nav>
            <a href="{{ url_for('Basics') }}">Basics</a>
            <a href="{{ url_for('About') }}">About</a>
            <a href="{{ url_for('Lineups') }}">Lineups</a>
        </nav>
    </header>

    <div class="layout">
        <div class="player-name ">
                <img src="{{ steaminfo.Avatar }}" alt="Profile Avatar" height ="400">
                <p>{{ steaminfo.Name }}</p>
        </div>

        <div class="stats">
            {% for stat in stats %}
            <details class="stat-row {{ stat.color }}">
                <summary>{{ stat.name }}: {{ stat.label }}</summary>
                <div class="stat-detail">
                    {{ stat.value }}
                </div>
            </details>
            {% endfor %}

            <div class="leetify-credit">
                <p>View on Leetify: <a href="https://leetify.com/">https://leetify.com/</a></p>
                <a href="https://leetify.com/" target="_blank" rel="noopener noreferrer">
                    <img src="{{ url_for('static', filename='Leetify Badge Black Large.png') }}" alt="Leetify" height="100">
                </a>
            </div>
            
        </div>
    </div>


    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            once: true
        });
    </script>

    <script>
    let lastScroll = 0;
    const header = document.querySelector('header');

    window.addEventListener('scroll', () => {
        const currentScroll = window.scrollY;

        if (currentScroll > lastScroll && currentScroll > 80) {
            // Scrolling down - hide header
            header.style.transform = 'translateY(-100%)';
            header.style.transition = 'transform 0.3s ease';
        } else {
            // Scrolling up - show header
            header.style.transform = 'translateY(0)';
            header.style.transition = 'transform 0.3s ease';
        }

        lastScroll = currentScroll;
    });
    </script>
</body>
</html>
