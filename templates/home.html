<!DOCTYPE html>
<html>
<head>
    <title>CS2 Tracker</title>
    <style>

        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap');

        .black-ops-one-regular {
        font-family: "Black Ops One", system-ui;
        font-weight: 400;
        font-style: normal;
        }

        body {
            font-family: "Black Ops One";
            margin: 0;
            background-color: #BDB7AB;
            color: #2b0505;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 3rem;
            background-color: #877F7D;
            border-bottom: 0.5px solid #6b1a1a;
        }

        header nav a {
            font-family: "Black Ops One";
            margin-left: 1.5rem;
            font-size: 1.5rem;
            text-decoration: none;
            color: #2b0505;
            
        }

        .home-wrapper {
            font-family: "Black Ops One";
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 2rem;
        }

        .home-title {
            font-family: "Black Ops One";
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .home-subtitle {
            font-family: "Black Ops One";
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }

        .search-form input[type="text"] {
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border-radius: 8px;
            border: none;
            width: 300px;
        }

        .search-form button {
            padding: 0.75rem 1.25rem;
            font-size: 1rem;
            border-radius: 8px;
            border: none;
            margin-left: 0.5rem;
            cursor: pointer;
        }

        .flash-message {
            color: #ffbaba;
            margin-top: 1rem;
        }

        .nav-buttons {
            margin-top: 3rem;
            display: flex;
            gap: 1.5rem;
        }

        .nav-buttons a {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            background-color: #877F7D;
            color: #2b0505;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <a href="{{ url_for('home') }}">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" height="160">
        </a>
        <nav>
            <a href="{{ url_for('Basics') }}">Basics</a>
            <a href="{{ url_for('About') }}">About</a>
            <a href="{{ url_for('Lineups') }}">Lineups</a>
        </nav>
    </header>

    <div class="home-wrapper">
        <h1 class="home-title">Stat Analysis</h1>
        <p class="home-subtitle">Please enter your Steam ID</p>

        <form class="search-form" action="{{ url_for('go') }}" method="get">
            <input type="text" name="steam_id" placeholder="Steam64 ID" required>
            <button type="submit">Search</button>
        </form>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <p class="flash-message">{{ messages[0] }}</p>
          {% endif %}
        {% endwith %}

        <div class="nav-buttons">
            <a href="{{ url_for('Lineups') }}">Lineups</a>
            <a href="{{ url_for('Basics') }}">Basics</a>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            once: true
        });
    </script>

    <script>
    let lastScroll = 0;
    const header = document.querySelector('header');

    window.addEventListener('scroll', () => {
        const currentScroll = window.scrollY;

        if (currentScroll > lastScroll && currentScroll > 80) {
            // Scrolling down - hide header
            header.style.transform = 'translateY(-100%)';
            header.style.transition = 'transform 0.3s ease';
        } else {
            // Scrolling up - show header
            header.style.transform = 'translateY(0)';
            header.style.transition = 'transform 0.3s ease';
        }

        lastScroll = currentScroll;
    });
    </script>
</body>
</html>
